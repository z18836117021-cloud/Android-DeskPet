name: Build Kid DeskPet APK

on:
  workflow_dispatch:
  push:
    branches:
      - kid-deskpet
    paths:
      - 'KidDeskPet/**'
      - 'kid_sprite_parts/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and verify kid sprite
        shell: bash
        run: |
          mkdir -p KidDeskPet/app/src/main/res/drawable-nodpi
          cat kid_sprite_parts/part_{00..13}.b64 > /tmp/kid_sprite.b64
          test "$(wc -c < /tmp/kid_sprite.b64)" -eq 69288
          base64 -d /tmp/kid_sprite.b64 > KidDeskPet/app/src/main/res/drawable-nodpi/kid_sprite.webp
          echo "0499bb5858882e5059858b99b1e5bc175d1cedfc7b98e317888ad2c84c49e335  KidDeskPet/app/src/main/res/drawable-nodpi/kid_sprite.webp" | sha256sum -c -

      - name: Build Kid DeskPet APK
        run: gradle --no-daemon -p KidDeskPet :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-KidDeskPet-APK
          path: KidDeskPet/app/build/outputs/apk/debug/app-debug.apk
